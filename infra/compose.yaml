services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: personal_agent
      POSTGRES_USER: personal_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - personal_agent_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_agent -d personal_agent"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  personal_agent_db:
